site_name: COFOLDER Documentation
site_description: Collection of tools for performing various co-folding tasks using Cofoloding models (e.g. Boltz)
site_author: Bola Khalil
repo_url: https://github.com/CDDLeiden/cofolder
repo_name: CDDLeiden/cofolder

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            line_length: 80

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Overview: user-guide/overview.md
      - Predict: user-guide/predict.md
      - Screen: user-guide/screen.md
      - Oracle: user-guide/oracle.md
      - Evaluate: user-guide/evaluate.md
  - Tutorials:
      - Basic Usage: tutorials/basic.md
      - Virtual Screening: tutorials/screening.md
      - Ligand Handling: tutorials/ligands.md
      - Advanced Features: tutorials/advanced.md
  - API Reference:
      - Recipes:
          - Predict: api/recipes/predict.md
          - Screen: api/recipes/screen.md
          - Oracle: api/recipes/oracle.md
          - Evaluate: api/recipes/evaluate.md
      - Modules:
          - Input: api/modules/input.md
          - Entities: api/modules/entities.md
          - Utils: api/modules/utils.md
          - Analytics: api/modules/analytics.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CDDLeiden/cofolder
