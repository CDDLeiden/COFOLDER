[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cofolder"
version = "0.1.0"
description = "Collection of helpful tools for performing various co-folding tasks using cofolding models (e.g. Boltz.)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  {name = "Remco L. van den Broek", email = "r.l.van.den.broek@lacdr.leidenuniv.nl"},
  {name = "Bola Khalil", email = "b.a.a.khalil@lacdr.leidenuniv.nl"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "biopython",
    "rdkit",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "gemmi",
    "prolif",
    "pdb2pqr",
    "packaging",
]

[project.optional-dependencies]
boltz1 = [
    "boltz==1.0.0; python_version < '3.13'",
]
boltz2 = [
    "boltz[cuda]; python_version < '3.13'",
]
boltz-community = [
    "boltz-community[cuda] @ git+https://github.com/Novel-Therapeutics/boltz-community.git",
]
openfold3 = [
    "openfold3",
]
acceptance = [
    "marimo>=0.23,<0.24",
]
tutorials = [
    "marimo>=0.23,<0.24",
]
test = [
    "marimo>=0.23,<0.24",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
[project.scripts]
cofolder = "cofolder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cofolder*"]
exclude = ["cofolder.ui", "cofolder.ui.*"]

[tool.setuptools.package-data]
"cofolder.acceptance" = ["data/*.yaml", "data/*.csv"]
