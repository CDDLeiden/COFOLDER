[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz-lab"
version = "0.0.0-dev"
description = "Collection of helpful tools for performing various co-folding tasks using Boltz."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  {name = "Remco L. van den Broek", email = "r.l.van.den.broek@lacdr.leidenuniv.nl"},
    {name = "Bola Khalil", email = "b.a.a.khalil@lacdr.leidenuniv.nl"}
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "boltz[cuda]",
    "rdkit",
    "matplotlib",
    "seaborn",
    "streamlit>=1.28.0",
    "streamlit-option-menu>=0.3.6",
    "pyyaml"
]

[project.optional-dependencies]
test = [
]
ui = [
    "streamlit>=1.28.0",
    "streamlit-option-menu>=0.3.6",
    "pyyaml"
]

[project.scripts]
boltz-eval = "boltz_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boltz_eval*"]